[workspace]
resolver = "2"
members = ["crates/core", "crates/devserver", "src-tauri"]
default-members = ["crates/core", "crates/devserver"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
