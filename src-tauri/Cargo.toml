[package]
name = "skills-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "One library for your agent skills (desktop app)"
publish = false

[lib]
name = "skills_library_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
skillslib-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# GitHub에서 스킬 받기. 업데이터 플러그인과 같은 reqwest·rustls(ring)를 써서 새로 받는 크레이트가 거의 없어요.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sys-locale = "0.3"
